services:

  # ─── PostgreSQL 16 + pgvector ──────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: novel-db
    environment:
      POSTGRES_DB: ${DB_NAME:-novel_agent}
      POSTGRES_USER: ${DB_USER:-novel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novel123}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/V1__init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./sql/V2__add_chapter_titles.sql:/docker-entrypoint-initdb.d/02_chapter_titles.sql:ro
      - ./sql/V2__continue_search.sql:/docker-entrypoint-initdb.d/03_continue_search.sql:ro
      - ./sql/V3__add_job_status.sql:/docker-entrypoint-initdb.d/04_job_status.sql:ro
      - ./sql/V3__eval_results.sql:/docker-entrypoint-initdb.d/05_eval_results.sql:ro
      - ./sql/V4__system_config.sql:/docker-entrypoint-initdb.d/06_system_config.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-novel} -d ${DB_NAME:-novel_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── Redis (SearXNG dependency) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: novel-redis
    restart: unless-stopped

  # ─── SearXNG (web search) ──────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: novel-searxng
    ports:
      - "8088:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8088/
    depends_on:
      - redis
    restart: unless-stopped

  # ─── Spring Boot app ───────────────────────────────────
  app:
    build: .
    container_name: novel-app
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-novel_agent}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-novel}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-novel123}
      APP_JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string-at-least-32-chars}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EMBED_API_KEY: ${LLM_EMBED_API_KEY:-}
      LLM_EMBED_BASE_URL: ${LLM_EMBED_BASE_URL:-}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-}
      APP_RETRIEVAL_GRAPH_ENABLED: ${APP_RETRIEVAL_GRAPH_ENABLED:-false}
      SEARXNG_URL: http://searxng:8080
    restart: unless-stopped

  # ─── Interactive setup wizard ──────────────────────────
  onboard:
    build: .
    container_name: novel-onboard
    stdin_open: true
    tty: true
    entrypoint: ["/app/scripts/onboard.sh"]
    volumes:
      - .:/app/host   # mount repo root so onboard can write .env
    profiles:
      - onboard

  # ─── Vue 3 frontend (Vite dev server) ──────────────────
  frontend:
    build: ./frontend
    container_name: novel-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - frontend_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=${VITE_API_TARGET:-http://app:8080}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  frontend_modules:
