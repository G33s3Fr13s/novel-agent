use_default_settings: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh"
  formats:
    - html
    - json

server:
  secret_key: "change-me-at-startup"
  bind_address: "127.0.0.1"
  port: 8088
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

redis:
  url: redis://localhost:6379/0

engines:
  - name: baidu
    disabled: false
    timeout: 12.0
  - name: 360search
    disabled: false
  - name: brave
    disabled: false

outgoing:
  request_timeout: 20.0
  max_request_timeout: 30.0
