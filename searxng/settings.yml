use_default_settings: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh"
  formats:
    - html
    - json

server:
  secret_key: "change-me-to-random-string"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

redis:
  url: redis://redis:6379/0

engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
